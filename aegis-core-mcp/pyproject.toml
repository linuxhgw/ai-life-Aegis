[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-core-mcp"
version = "0.1.0"
description = "Aegis Core MCP server for tasks, reminders, feedback, and execution history."
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.0.0",
  "PyYAML>=6.0.0",
  "aiohttp>=3.9.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
aegis-core-mcp = "aegis_core_mcp.server:main"
aegis-reminder-worker = "aegis_core_mcp.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
